[package]
name = "ratty-relay"
version = "0.1.0"
edition = "2024"
description = "Tier-B spectator relay for the Ratty terminal — control-silent output tee with WebSocket fan-out"
license = "MIT"
repository = "https://github.com/orhun/ratty"
# In-repo tool: it shares the terminal's OSC classification via a `#[path]`
# include that reaches outside the crate directory, so it is not a
# crates.io package.
publish = false

# Standalone crate (not part of the root workspace, like tools/ratty-ai and
# tools/silk). Host mode classifies OSC 777 with the crate's own predicates
# (`is_control_plane` / `is_execution_control`) so the relay and the
# terminal can never disagree about what is control-plane.

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
# Control frames (`hello` / `resize` / `end` …) are JSON text frames,
# out-of-band from the binary output stream.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Same PTY layer as the terminal itself (src/runtime.rs).
portable-pty = "0.8"
# Synchronous WebSocket: one accept loop + one thread per spectator; no
# async runtime.
tungstenite = "0.24"

[target.'cfg(unix)'.dependencies]
# Raw-mode tty (termios), winsize, and the SIGWINCH self-pipe.
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
strip = true
