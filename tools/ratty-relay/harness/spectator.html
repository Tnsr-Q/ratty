<!doctype html>
<!--
  Minimal web-spectator harness for `ratty-relay` (ratty #46/#62, map #42).

  This is the walking skeleton's `ws.onmessage → session.feed()` proof —
  NOT the site widget. Hosting, embedding, reconnect UX, and how N panes
  ever reach the page API belong to the browser-story lane (#53 → #57).

  Stage 2 adds the spectator half of the presence contract: this page tracks
  the mirrored rows the relay announces in `presence-mirror` control frames
  and feeds `user.leave` / `note.remove` for each on ANY socket close — clean
  end, drop, or the relay dying outright. Spectator instances are
  connection-ephemeral, which is what keeps a mirrored row from outliving the
  link it arrived on. The ids are tracked out-of-band deliberately: there is
  no second OSC parser here to drift from the terminal's.

  To run: build the wasm bundle with `bash site/build-wasm.sh` (it needs
  `wasm-bindgen-cli` at the version Cargo.toml pins with a hard `=`), which
  emits `site/pkg/ratty.js` + `site/pkg/ratty_bg.wasm`. Copy this file into
  `site/pkg/` — or serve it beside a `pkg/` holding that output — with any
  static server (WebGPU requires a secure context or localhost). Then start a
  hosted session with `ratty -e ratty-relay host ... zsh` (unquoted argv; the
  exact separator story is pinned by tests/cli_seam.rs and the design doc),
  open this page, and connect to ws://127.0.0.1:7877.

  NOT `wasm-pack build widget`: `widget/` is the crate `ratatui-ratty`, a
  Ratatui widget with no wasm-bindgen dependency and no cdylib. The
  `start()` / `feed()` / `drain_input()` surface this page drives is exported
  from `src/web.rs` and is only ever built by site/build-wasm.sh.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ratty-relay spectator harness</title>
    <style>
      body { margin: 0; background: #111; color: #9ae; font: 13px monospace; }
      #bar { padding: 6px 8px; display: flex; gap: 8px; align-items: center; }
      #status { color: #7c7; }
      #ratty-canvas { display: block; width: 100vw; height: calc(100vh - 34px); }
      input { background: #222; color: #cde; border: 1px solid #345; padding: 3px 6px; width: 22em; }
      button { background: #234; color: #cde; border: 1px solid #456; padding: 3px 10px; }
    </style>
  </head>
  <body>
    <div id="bar">
      <input id="url" value="ws://127.0.0.1:7877" />
      <button id="connect">connect</button>
      <span id="status">idle</span>
    </div>
    <canvas id="ratty-canvas"></canvas>
    <script type="module">
      // wasm-bindgen names its output after the crate (`ratty`), so
      // site/build-wasm.sh emits site/pkg/ratty.js. Use "./ratty.js" instead
      // when serving this file from inside site/pkg/.
      const WIDGET_MODULE = "./pkg/ratty.js";
      const status = (t) => (document.getElementById("status").textContent = t);

      let session = null;
      let ws = null;
      // Mirrored presence rows this spectator has been told it holds, keyed
      // "<kind>:<id>". Released on every close path.
      let mirrored = new Map();

      // Mirrored ids are ASCII [A-Za-z0-9_.-] by the terminal's own id
      // charset, every byte of which is percent-encoding-unreserved — so the
      // teardown needs no encoder, and cannot invent one that drifts.
      function releaseMirrors() {
        if (!session || mirrored.size === 0) return;
        let wire = "";
        for (const { kind, id } of mirrored.values()) {
          const action = kind === "note" ? "note.remove" : "user.leave";
          wire += `\x1b]777;ratty:${action};id=${id}\x07`;
        }
        mirrored.clear();
        session.feed(new TextEncoder().encode(wire));
        session.drain_input();
      }

      async function boot() {
        try {
          const widget = await import(WIDGET_MODULE);
          await widget.default();
          session = widget.start("#ratty-canvas", "");
          // The spectator parser's auto-replies (cursor reports, RGP/778
          // acks) accumulate forever in the unbounded input channel unless
          // drained; a read-only spectator discards them.
          setInterval(() => { if (session) session.drain_input(); }, 250);
          status("widget ready");
        } catch (err) {
          status(`widget failed to load: ${err} — check WIDGET_MODULE`);
        }
      }

      document.getElementById("connect").addEventListener("click", () => {
        if (!session) { status("widget not ready"); return; }
        if (ws) ws.close();
        ws = new WebSocket(document.getElementById("url").value);
        ws.binaryType = "arraybuffer";
        ws.onopen = () => status("connected");
        // Any close — clean end, drop, or the relay dying — releases the
        // mirrors. `onclose` fires on every one of those paths.
        ws.onclose = () => { releaseMirrors(); status("disconnected"); };
        ws.onerror = () => status("connection error");
        ws.onmessage = (event) => {
          if (typeof event.data === "string") {
            const frame = JSON.parse(event.data);
            if (frame.type === "hello") {
              status(`session '${frame.session}' ${frame.cols}x${frame.rows}` +
                     (frame.degraded ? " (degraded join)" : ""));
            } else if (frame.type === "presence-mirror") {
              // The primary reset already cleared this instance's rosters
              // through the forwarded bytes, so drop the tracked set too.
              if (frame.clear) mirrored.clear();
              for (const row of frame.remove ?? []) mirrored.delete(`${row.kind}:${row.id}`);
              for (const row of frame.add ?? []) mirrored.set(`${row.kind}:${row.id}`, row);
            } else if (frame.type === "end") {
              status(`session ended (${frame.reason})`);
            }
            return; // control frames are metadata, never fed to the parser
          }
          session.feed(new Uint8Array(event.data));
        };
      });

      // A tab closed or navigated away is the same event class as a socket
      // drop: the link is gone, so the mirrors go with it.
      window.addEventListener("pagehide", releaseMirrors);

      boot();
    </script>
  </body>
</html>
