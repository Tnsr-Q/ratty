[window]
width = 960
height = 620
opacity = 0.8
# scale_factor = 1.0

[terminal]
default_cols = 104
default_rows = 32
scrollback = 2000
# How many terminals may live at once, across every spawn path (the
# Ctrl+Alt+T chord and the wire's term.spawn alike). Clamped to 1..=128 —
# 128 is the protocol's hard ceiling, since object ids carry the agent
# namespace in seven bits. Raising this past 4 waits on a shared font
# context: every live terminal carries its own font stack today.
max_live = 4

# [shell]
# program = "/bin/bash" 
# args = []

[env]
TERM = "xterm-256color"

[font]
family = "DejaVu Sans Mono"
style = "Regular"
size = 12

[cursor.model]
path = "CairoSpinyMouse.obj"
# texture = "texture.png"
scale_factor = 6.0
brightness = 0.5
x_offset = 0.5
plane_offset = 18.0
visible = true

[cursor.animation]
spin_speed = 1.4
bob_speed = 2.2
bob_amplitude = 0.08

[bindings]
keys = [
  { key = "C", with = "Control | alt", action = "Copy" },
  { key = "V", with = "Control | alt", action = "Paste" },
  { key = "PageUp", with = "alt", action = "ScrollPageUp" },
  { key = "PageDown", with = "alt", action = "ScrollPageDown" },
  { key = "Up", with = "alt", action = "ScrollUp" },
  { key = "Down", with = "alt", action = "ScrollDown" },
  { key = "Equal", with = "Control", action = "IncreaseFontSize" },
  { key = "Minus", with = "Control", action = "DecreaseFontSize" },
  { key = "Digit0", with = "Control | alt", action = "ResetFontSize" },
  { key = "Enter", with = "Control | alt", action = "Toggle3DMode" },
  { key = "M", with = "Control | alt", action = "ToggleMobiusMode" },
  { key = "Up", with = "Control | alt", action = "IncreaseWarp" },
  { key = "Down", with = "Control | alt", action = "DecreaseWarp" },
]

[theme]
foreground = "#dcd7ba"
background = "#1f1f28"
cursor = "#7e9cd8"

[theme.normal]
black = "#000000"
red = "#cd3131"
green = "#0dbc79"
yellow = "#e5e510"
blue = "#2472c8"
magenta = "#bc3fbc"
cyan = "#11a8cd"
white = "#e5e5e5"

[theme.bright]
black = "#666666"
red = "#f14c4c"
green = "#23d18b"
yellow = "#f5f543"
blue = "#3b8eea"
magenta = "#d670d6"
cyan = "#29b8db"
white = "#ffffff"

# The reactive organ (#21). Everything under [reactive] is trusted-tier:
# no wire command can write it. The native system-sensor adapter
# (sys.cpu / sys.memory / sys.battery) is OFF by default — enabling it is
# a deliberate grant, and registering a rule never makes ratty inspect
# the host. Trusted rules survive `ratty:reset` and cannot be mutated
# from the wire; the `action` string uses the same grammar as the wire's
# `do=` value.
#
# [reactive]
# system_sensors = true
# system_sample_secs = 2.0
#
# [[reactive.rules]]
# name = "cpu-alarm"
# sensor = "sys.cpu"
# above = 85
# clear = 70
# debounce = 3.0
# cooldown = 30.0
# action = "flash;color=%23ff0000&duration=0.4"
